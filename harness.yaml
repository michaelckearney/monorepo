# The monorepo, for the harness: see https://github.com/michaelckearney/harness
schema: 1
# The harness this monorepo uses: what its pipelines install, and what its
# servers update themselves to when this changes on main.
harness: v0.7.14
repo: michaelckearney/monorepo
# Who can give the bots work: only their issues, comments, reviews, and labels count.
triggers: [michaelckearney]
agents:
  # Codex and Claude Code talk in Discord, write the digest, and run the
  # tasks, which write the issues: Codex first, Claude Code when Codex is at
  # its limit. opencode works the issues.
  talk: [openai-codex, claude-code]
  work: opencode
  # An agent that sends the code to a third party belongs here only if whoever
  # owns the code agreed to it. claude-code runs on the Claude subscription,
  # openai-codex on the ChatGPT one.
  allowed: [opencode, claude-code, openai-codex]
# The servers the bots run on, the model, the GitHub App and the keys are
# each server's own: see harness deploy -h, and dgx-spark's harness role.
# The projects, each a folder the framework builds. The framework, the code
# and tooling every project shares, is in framework/.
projects:
  harbor: projects/harbor
  slipway: projects/slipway
# Recurring work the bots do on their own, each run opening one issue at most;
# a task runs while fewer than max_open open issues carry its label.
tasks:
  design:
    prompt: tasks/design.md
    before: harness test -e2e
    label: design
    max_open: 2
