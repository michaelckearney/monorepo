<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payday · Northwind</title>
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<style>
  :root { --accent: #be123c; --bg: #fafaf9; --card: #fff; --text: #1c1917; --muted: #78716c; --border: #e7e5e4; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 1rem; align-items: center; padding: 0.7rem 1.5rem; background: var(--accent); color: #fff; }
  header .name { font-weight: 700; flex: 1; }
  main { max-width: 56rem; margin: 1.5rem auto; padding: 0 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .narrow { max-width: 24rem; margin: 4rem auto; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--border); }
  th { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  button, select, input { font: inherit; padding: 0.35rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  .primary, a.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; text-decoration: none; padding: 0.45rem 1rem; border-radius: 6px; display: inline-block; }
  .muted { color: var(--muted); }
  .error { color: #b91c1c; }
  form.row { display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: end; }
  form.row label { display: flex; flex-direction: column; font-size: 0.85rem; }
  header button { background: transparent; color: #fff; border-color: rgba(255,255,255,.6); }
</style>
</head>
<body>
<header><span class="name">Payday</span><span id="who"></span><button id="signout" hidden>Sign out</button></header>
<main id="main"><p class="muted">Loading…</p></main>
<script src="/static/app.js"></script>
</body>
</html>
