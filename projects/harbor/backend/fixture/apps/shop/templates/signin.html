{{define "header"}}<header class="top"><a class="name" href="/">parcel</a></header>{{end}}
{{define "content"}}
<div class="card narrow">
<h1>Sign in</h1>
{{if .Data.Error}}<p class="error" role="alert">{{.Data.Error}}</p>{{end}}
{{if .Data.Login.CSRF}}
<form method="post" action="/signin" accept-charset="UTF-8">
  <input type="hidden" name="utf8" value="✓">
  <input type="hidden" name="authenticity_token" value="{{.Data.Login.CSRF}}">
  <input type="hidden" name="return_to" value="{{.Data.Login.ReturnTo}}">
  <label>Email <input type="email" name="session[email]" autocomplete="username" autofocus required></label>
  <label>Password <input type="password" name="session[password]" autocomplete="current-password" required></label>
  <input type="submit" name="commit" value="Sign in" class="button">
</form>
{{else}}<p><a class="button" href="/signin">Sign in again</a></p>{{end}}
</div>
{{end}}
