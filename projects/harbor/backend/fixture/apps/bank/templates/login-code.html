{{define "content"}}
<div class="card narrow">
<h1>Two-step verification</h1>
<p>Enter the 6-digit code from your authenticator app.</p>
{{if .Data.Error}}<p class="error" role="alert">{{.Data.Error}}</p>{{end}}
<form method="post" action="/login/code">
  <input type="hidden" name="authenticity_token" value="{{.Data.Login.CSRF}}">
  <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" autofocus required></label>
  <label class="check"><input type="checkbox" name="remember"> Remember this device for 30 days</label>
  <button>Verify</button>
</form>
</div>
{{end}}
