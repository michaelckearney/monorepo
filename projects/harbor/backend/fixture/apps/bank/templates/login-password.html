{{define "content"}}
<div class="card narrow">
<h1>Enter your password</h1>
<p class="muted">Signing in as <strong>{{.Data.Login.Username}}</strong>. <a href="/login">Not you?</a></p>
{{if .Data.Error}}<p class="error" role="alert">{{.Data.Error}}</p>{{end}}
<form method="post" action="/login/password">
  <input type="hidden" name="authenticity_token" value="{{.Data.Login.CSRF}}">
  <input type="hidden" name="username" value="{{.Data.Login.Username}}" autocomplete="username">
  <label>Password <input type="password" name="password" autocomplete="current-password" autofocus required></label>
  <button>Sign in</button>
</form>
</div>
{{end}}
