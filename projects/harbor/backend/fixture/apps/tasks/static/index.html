<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tasklane</title>
<link rel="mask-icon" href="/icons/mask-icon.svg" color="#2563eb">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
  :root { --accent: #2563eb; --bg: #f8fafc; --card: #fff; --text: #0f172a; --muted: #64748b; --border: #e2e8f0; --danger: #dc2626; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; gap: 1rem; align-items: center; padding: 0.6rem 1.25rem; background: #0f172a; color: #fff; }
  header .name { font-weight: 700; color: #fff; text-decoration: none; }
  header nav { flex: 1; display: flex; gap: 1rem; }
  header a { color: #cbd5e1; text-decoration: none; }
  main { max-width: 64rem; margin: 1.5rem auto; padding: 0 1rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
  .narrow { max-width: 24rem; margin: 4rem auto; text-align: center; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { font-size: 0.75rem; text-transform: uppercase; color: var(--muted); }
  button, select, input, textarea { font: inherit; padding: 0.35rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; background: #fff; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  .muted { color: var(--muted); }
  .error { color: var(--danger); }
  .state { font-size: 0.75rem; padding: 0.1rem 0.45rem; border-radius: 999px; background: #e2e8f0; white-space: nowrap; }
  .filters { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
  #toast { position: fixed; bottom: 1rem; right: 1rem; background: #0f172a; color: #fff; padding: 0.6rem 1rem; border-radius: 6px; display: none; }
  label { display: block; margin-bottom: 0.6rem; }
  label input, label textarea, label select { display: block; width: 100%; margin-top: 0.2rem; }
</style>
</head>
<body>
<header><a class="name" href="/">Tasklane</a><nav><a href="/">Issues</a><a href="/new">New issue</a></nav><span id="who"></span><button id="signout" hidden>Sign out</button></header>
<main id="main"><p class="muted">Loading…</p></main>
<div id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
